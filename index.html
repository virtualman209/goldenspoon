<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Camera</title>
<style>
  :root{
    --bg:#000; --fg:#fff; --muted:#8a8a8e; --rec:#ff3b30;
    --accent:#0a84ff; --panel:rgba(28,28,30,.85); --card:#1c1c1e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;user-select:none;-webkit-user-select:none;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}

  #stage{position:relative;flex:1;background:#000;overflow:hidden;}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;}
  video.mirror{transform:scaleX(-1);}

  #top{position:absolute;top:0;left:0;right:0;z-index:5;
    padding:max(14px,env(safe-area-inset-top)) 16px 10px;
    display:flex;justify-content:space-between;align-items:flex-start;
    background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);}
  #timer{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;
    font-size:17px;font-weight:600;opacity:0;transition:opacity .2s;}
  #timer.on{opacity:1;}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--rec);
    animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:.25;}}
  #libBtn{position:relative;background:var(--panel);border:none;color:#fff;
    width:44px;height:44px;border-radius:12px;font-size:20px;cursor:pointer;}
  #libBtn:active{transform:scale(.9);}
  #libCount{position:absolute;top:-6px;right:-6px;background:var(--accent);
    color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;
    border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px;}
  #libCount.show{display:flex;}

  #controls{position:relative;z-index:5;
    padding:18px 24px max(22px,env(safe-area-inset-bottom));
    background:#000;display:flex;align-items:center;justify-content:space-between;}
  .side{width:62px;height:62px;display:flex;align-items:center;justify-content:center;}
  .iconbtn{width:54px;height:54px;border-radius:50%;border:none;background:var(--panel);
    color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .iconbtn:active{transform:scale(.9);}

  #shutterWrap{width:84px;height:84px;position:relative;}
  #shutter{width:84px;height:84px;border-radius:50%;border:5px solid #fff;background:transparent;
    cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;}
  #shutterInner{width:66px;height:66px;border-radius:50%;background:#fff;transition:all .25s;}
  body[data-mode="video"] #shutterInner{background:var(--rec);}
  body[data-rec="1"] #shutterInner{width:30px;height:30px;border-radius:9px;background:var(--rec);}
  #shutter:active{transform:scale(.94);}

  #modes{position:absolute;bottom:calc(100% + 6px);left:0;right:0;display:flex;
    justify-content:center;gap:26px;padding:10px 0;z-index:5;
    background:linear-gradient(to top,#000 60%,transparent);}
  .mode{font-size:14px;font-weight:700;letter-spacing:.5px;color:var(--muted);
    background:none;border:none;cursor:pointer;text-transform:uppercase;padding:6px 4px;}
  .mode.active{color:#ffd60a;}

  /* library */
  #library{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column;}
  #library.show{display:flex;}
  #libHead{display:flex;align-items:center;justify-content:space-between;
    padding:max(14px,env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid #1c1c1e;}
  #libHead h2{margin:0;font-size:19px;}
  #libHead .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  #libHead .headBtns{display:flex;gap:8px;flex-shrink:0;}
  #libClear{background:#3a2a2a;border:none;color:#ff6b60;border-radius:10px;
    padding:9px 14px;font-size:15px;font-weight:600;cursor:pointer;}
  #libClear:disabled{opacity:.4;}
  #libClose{background:#2c2c2e;border:none;color:#fff;border-radius:10px;
    padding:9px 16px;font-size:15px;font-weight:600;cursor:pointer;}
  #libList{flex:1;overflow-y:auto;padding:14px 14px max(30px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;}
  .item{background:var(--card);border-radius:14px;overflow:hidden;}
  .item .media{width:100%;background:#000;}
  .item .media img,.item .media video{width:100%;display:block;max-height:60vh;object-fit:contain;}
  .item .meta{display:flex;flex-direction:column;align-items:stretch;
    padding:12px 14px;gap:12px;}
  .item .meta .info{min-width:0;}
  .item .meta .name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;}
  .item .meta .time{font-size:12px;color:var(--muted);margin-top:2px;}
  .item .acts{display:flex;gap:10px;}
  .item .acts button{flex:1;border:none;border-radius:11px;padding:14px 12px;font-size:15px;
    font-weight:600;cursor:pointer;white-space:nowrap;}
  .item .acts button:active{transform:scale(.96);}
  .exp{background:var(--accent);color:#fff;}
  .del{background:#3a2a2a;color:#ff6b60;}
  #libEmpty{color:var(--muted);text-align:center;margin:60px 20px;font-size:15px;line-height:1.6;}

  /* blackout */
  #blackout{position:fixed;inset:0;z-index:60;background:#000;display:none;}
  #blackout.show{display:block;}
  #blackout #tapHint{position:absolute;bottom:40px;left:0;right:0;text-align:center;
    color:#141414;font-size:12px;}

  /* message / error */
  #msg{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:30px;background:#000;gap:16px;}
  #msg.show{display:flex;}
  #msg h2{margin:0;font-size:20px;}
  #msg p{margin:0;color:var(--muted);font-size:15px;line-height:1.5;max-width:320px;}
  #msg button{margin-top:8px;padding:14px 28px;border-radius:12px;border:none;
    background:var(--accent);color:#fff;font-size:16px;font-weight:600;}

  .flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:15;pointer-events:none;}

  #toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);
    background:rgba(50,50,52,.95);color:#fff;padding:12px 20px;border-radius:24px;
    font-size:14px;font-weight:600;z-index:80;opacity:0;transition:all .25s;pointer-events:none;
    max-width:86%;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body data-mode="photo">
<div id="app">
  <div id="stage">
    <video id="preview" autoplay playsinline muted></video>
    <div class="flash" id="flash"></div>

    <div id="top">
      <button id="libBtn">📁<span id="libCount"></span></button>
      <div id="timer"><span class="dot"></span><span id="time">15:00</span></div>
    </div>

    <div id="msg" class="show">
      <h2>Camera</h2>
      <p>Chạm để mở camera. Trình duyệt sẽ hỏi quyền — hãy chọn <b>Cho phép</b>.</p>
      <button id="startBtn">Mở camera</button>
    </div>
  </div>

  <div id="controls">
    <div id="modes">
      <button class="mode active" data-m="photo">Ảnh</button>
      <button class="mode" data-m="video">Video</button>
    </div>
    <div class="side"><button class="iconbtn" id="blackBtn" title="Màn hình đen">🌙</button></div>
    <div id="shutterWrap"><button id="shutter"><span id="shutterInner"></span></button></div>
    <div class="side"><button class="iconbtn" id="flipBtn" title="Đổi camera">🔄</button></div>
  </div>
</div>

<!-- library -->
<div id="library">
  <div id="libHead">
    <div>
      <h2>Thư viện app</h2>
      <div class="sub" id="libSub">Lưu riêng trong app · không có trong Ảnh iPhone</div>
    </div>
    <div class="headBtns">
      <button id="libClear">Dọn sạch</button>
      <button id="libClose">Đóng</button>
    </div>
  </div>
  <div id="libList"></div>
</div>

<div id="blackout"><div id="tapHint">Chạm 2 lần để hiện lại</div></div>
<div id="toast"></div>

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const body = document.body;
  const preview = $("#preview");
  const timerEl = $("#timer"), timeEl = $("#time");
  const msg = $("#msg");

  const MAX_MS = 15 * 60 * 1000;
  let stream=null, facing="environment", mode="photo";
  let recorder=null, chunks=[], recStart=0, countdownIv=null, autoStopTo=null;
  let wakeLock=null, libUrls=[];

  /* ---------- private storage (IndexedDB) ---------- */
  const DB_NAME="cam_store", STORE="media", DB_VER=1;
  function openDB(){
    return new Promise((res,rej)=>{
      const r=indexedDB.open(DB_NAME,DB_VER);
      r.onupgradeneeded=()=>{const db=r.result;
        if(!db.objectStoreNames.contains(STORE)){
          const os=db.createObjectStore(STORE,{keyPath:"id"}); os.createIndex("time","time");}};
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    });
  }
  async function dbAdd(item){const db=await openDB();return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(item);
    tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
  async function dbAll(){const db=await openDB();return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,"readonly");const q=tx.objectStore(STORE).getAll();
    q.onsuccess=()=>res((q.result||[]).sort((a,b)=>b.time-a.time));q.onerror=()=>rej(q.error);});}
  async function dbDel(id){const db=await openDB();return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).delete(id);
    tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
  async function dbCount(){const db=await openDB();return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,"readonly");const q=tx.objectStore(STORE).count();
    q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
  async function dbClear(){const db=await openDB();return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).clear();
    tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}

  async function requestPersist(){
    try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  }

  async function saveToLibrary(blob,type,name,kind){
    const id = (self.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random();
    try{
      await dbAdd({id,kind,name,type,blob,time:Date.now()});
      toast(kind==="video"?"✓ Đã lưu video vào thư viện app":"✓ Đã lưu ảnh vào thư viện app");
      refreshCount();
    }catch(e){ toast("Lưu thất bại: "+(e.message||e)); }
  }

  async function refreshCount(){
    try{
      const n=await dbCount(); const el=$("#libCount");
      el.textContent=n; el.classList.toggle("show", n>0);
    }catch(e){}
  }

  /* ---------- library UI ---------- */
  async function openLibrary(){
    const list=$("#libList"); 
    libUrls.forEach(u=>URL.revokeObjectURL(u)); libUrls=[]; list.innerHTML="";
    let items=[]; try{ items=await dbAll(); }catch(e){}
    $("#libClear").disabled = !items.length;
    if(!items.length){
      list.innerHTML='<div id="libEmpty">Chưa có gì.<br>Ảnh và video bạn chụp/quay sẽ nằm ở đây — chỉ app này mở được.</div>';
    } else {
      for(const it of items){
        const url=URL.createObjectURL(it.blob); libUrls.push(url);
        const card=document.createElement("div"); card.className="item";
        const d=new Date(it.time);
        const t=d.toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
        const mediaHtml = it.kind==="video"
          ? `<video src="${url}" controls playsinline preload="metadata"></video>`
          : `<img src="${url}" loading="lazy">`;
        card.innerHTML=`
          <div class="media">${mediaHtml}</div>
          <div class="meta">
            <div class="info"><div class="name">${it.name}</div><div class="time">${t}</div></div>
            <div class="acts">
              <button class="exp">Xuất ra Ảnh</button>
              <button class="del">Xoá</button>
            </div>
          </div>`;
        card.querySelector(".exp").addEventListener("click",()=>exportToPhotos(it));
        card.querySelector(".del").addEventListener("click",()=>delItem(it.id,card));
        list.appendChild(card);
      }
    }
    $("#library").classList.add("show");
  }
  function closeLibrary(){
    $("#library").classList.remove("show");
    libUrls.forEach(u=>URL.revokeObjectURL(u)); libUrls=[];
    $("#libList").innerHTML="";
  }
  async function exportToPhotos(it){
    const file=new File([it.blob], it.name, {type:it.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==="AbortError") return; }
    }
    const url=URL.createObjectURL(it.blob);
    const a=document.createElement("a"); a.href=url; a.download=it.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }
  async function delItem(id,card){
    try{
      await dbDel(id);
    }catch(e){ toast("Xoá thất bại: "+(e.message||e)); return; }
    card.remove(); refreshCount();
    toast("✓ Đã xoá");
    if(!$("#libList").children.length){
      $("#libList").innerHTML='<div id="libEmpty">Chưa có gì.</div>';
      $("#libClear").disabled=true;
    }
  }
  async function clearAll(){
    let n=0; try{ n=await dbCount(); }catch(e){}
    if(!n) return;
    if(!confirm("Xoá toàn bộ "+n+" mục trong thư viện app? Không khôi phục được.")) return;
    try{
      await dbClear();
      libUrls.forEach(u=>URL.revokeObjectURL(u)); libUrls=[];
      $("#libList").innerHTML='<div id="libEmpty">Đã dọn sạch bộ nhớ app.</div>';
      $("#libClear").disabled=true;
      refreshCount();
      toast("✓ Đã dọn sạch bộ nhớ app");
    }catch(e){ toast("Dọn sạch thất bại: "+(e.message||e)); }
  }

  /* ---------- camera ---------- */
  async function openCamera(){
    stop();
    try{
      stream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}}, audio:true});
      preview.srcObject=stream;
      preview.classList.toggle("mirror", facing==="user");
      await preview.play().catch(()=>{});
      msg.classList.remove("show");
      requestPersist();
    }catch(e){
      showError("Không mở được camera",
        "Hãy cấp quyền Camera & Micro cho trang này trong Cài đặt Safari, rồi tải lại. Trang phải chạy qua HTTPS.");
    }
  }
  function stop(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
  function showError(h,p){
    msg.querySelector("h2").textContent=h; msg.querySelector("p").innerHTML=p;
    $("#startBtn").textContent="Thử lại"; msg.classList.add("show");
  }

  /* ---------- wake lock ---------- */
  async function lockScreen(){ try{ if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen"); }catch(e){} }
  async function unlockScreen(){ try{ if(wakeLock){ await wakeLock.release(); wakeLock=null; } }catch(e){} }
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible" && body.dataset.rec==="1") lockScreen();
  });

  /* ---------- photo ---------- */
  function takePhoto(){
    if(!stream) return;
    const vt=stream.getVideoTracks()[0], s=vt.getSettings();
    const w=s.width||preview.videoWidth, h=s.height||preview.videoHeight;
    const c=document.createElement("canvas"); c.width=w; c.height=h;
    const ctx=c.getContext("2d");
    if(facing==="user"){ ctx.translate(w,0); ctx.scale(-1,1); }
    ctx.drawImage(preview,0,0,w,h);
    const f=$("#flash"); f.style.transition="none"; f.style.opacity=".9";
    requestAnimationFrame(()=>{ f.style.transition="opacity .4s"; f.style.opacity="0"; });
    c.toBlob(b=>{ if(b) saveToLibrary(b,"image/jpeg","anh_"+ts()+".jpg","image"); }, "image/jpeg", 0.95);
  }

  /* ---------- video ---------- */
  function pickMime(){
    const opts=["video/mp4","video/mp4;codecs=h264","video/webm;codecs=vp9","video/webm"];
    for(const m of opts){ if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; }
    return "";
  }
  function startRec(){
    if(!stream) return;
    const mime=pickMime();
    try{ recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream); }
    catch(e){ showError("Không quay được","Thiết bị/trình duyệt không hỗ trợ ghi video."); return; }
    chunks=[];
    recorder.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    recorder.onstop=()=>{
      const type=recorder.mimeType||mime||"video/mp4";
      const ext=type.includes("mp4")?"mp4":"webm";
      const b=new Blob(chunks,{type});
      saveToLibrary(b,type,"video_"+ts()+"."+ext,"video");   // lưu riêng, KHÔNG vào Ảnh
    };
    recorder.start();
    recStart=Date.now(); body.dataset.rec="1"; timerEl.classList.add("on");
    lockScreen();
    autoStopTo=setTimeout(stopRec, MAX_MS);     // tự ngắt + tự lưu sau 15 phút
    countdownIv=setInterval(tick,250); tick();
  }
  function stopRec(){
    clearTimeout(autoStopTo); clearInterval(countdownIv);
    body.dataset.rec=""; timerEl.classList.remove("on");
    unlockScreen(); hideBlackout();
    if(recorder && recorder.state!=="inactive"){ try{ recorder.stop(); }catch(e){} }
  }
  function tick(){
    const left=Math.max(0, MAX_MS-(Date.now()-recStart));
    const s=Math.ceil(left/1000);
    timeEl.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  }

  /* ---------- blackout ---------- */
  function showBlackout(){ $("#blackout").classList.add("show"); }
  function hideBlackout(){ $("#blackout").classList.remove("show"); }
  let lastTap=0;
  $("#blackout").addEventListener("click",()=>{
    const now=Date.now(); if(now-lastTap<400) hideBlackout(); lastTap=now;
  });

  /* ---------- toast ---------- */
  let toastTo=null;
  function toast(txt){
    const el=$("#toast"); el.textContent=txt; el.classList.add("show");
    clearTimeout(toastTo); toastTo=setTimeout(()=>el.classList.remove("show"),2200);
  }

  function ts(){ const d=new Date(),p=n=>String(n).padStart(2,"0");
    return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds()); }

  /* ---------- events ---------- */
  $("#startBtn").addEventListener("click", openCamera);
  document.querySelectorAll(".mode").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(body.dataset.rec==="1") return;
      document.querySelectorAll(".mode").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active"); mode=btn.dataset.m; body.dataset.mode=mode;
    });
  });
  $("#shutter").addEventListener("click",()=>{
    if(!stream){ openCamera(); return; }
    if(mode==="photo") takePhoto();
    else { if(body.dataset.rec==="1") stopRec(); else startRec(); }
  });
  $("#flipBtn").addEventListener("click", async ()=>{
    if(body.dataset.rec==="1") return;
    facing=facing==="user"?"environment":"user"; await openCamera();
  });
  $("#blackBtn").addEventListener("click", showBlackout);
  $("#libBtn").addEventListener("click", openLibrary);
  $("#libClose").addEventListener("click", closeLibrary);
  $("#libClear").addEventListener("click", clearAll);
  window.addEventListener("pagehide", stop);

  refreshCount();
})();
</script>
</body>
</html>
